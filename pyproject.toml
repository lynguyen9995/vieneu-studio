[project]
name = "vieneu-local-tools"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.120,<1",
  "uvicorn>=0.38,<1",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "python-dotenv>=1,<2",
  "mcp>=1.20,<2",
  # speech-to-text service (stt/, 127.0.0.1:8002): Whisper + audio download for "listen ahead"
  "faster-whisper>=1.2,<2",
  "yt-dlp[default]>=2025.11.12",
  # cuBLAS for CTranslate2 on the GPU (cuDNN is optional since CTranslate2 4.6.3)
  "nvidia-cublas-cu12>=12.4,<13; sys_platform == 'win32' or sys_platform == 'linux'",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
